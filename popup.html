<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunflower Land UI Automation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup-shell">
      <section class="hero-card">
        <div class="hero-copy">
          <p class="eyebrow">Sunflower Land</p>
          <h1>UI Automation</h1>
          <p class="hero-text">v2.0.0 — UI-first automation helper</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="panel-kicker">Tác vụ chính</p>
            <h2>Cấu hình tự động</h2>
          </div>
        </div>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Auto mua công cụ + hạt giống</strong>
          </span>
          <input id="autoBuyTools" type="checkbox" class="custom-checkbox" />
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Restock Blacksmith khi hết stock</strong>
          </span>
          <input id="autoRestockBlacksmith" type="checkbox" class="custom-checkbox" />
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Sunflower cơ bản</strong>
          </span>
          <input id="autoSunflowerBasic" type="checkbox" class="custom-checkbox" checked />
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Tự nấu Fire Pit (bridge)</strong>
          </span>
          <input id="autoCookFirePit" type="checkbox" class="custom-checkbox" />
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Tự nấu Kitchen (bridge)</strong>
          </span>
          <input id="autoCookKitchen" type="checkbox" class="custom-checkbox" />
        </label>



        <label class="setting-row">
          <span class="setting-copy">
            <strong>Trồng + thu hoạch cây ăn quả (DOM)</strong>
          </span>
          <input id="autoFruitTree" type="checkbox" class="custom-checkbox" />
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Thu hoạch hoa, mật ong (DOM + Bridge)</strong>
          </span>
          <input id="autoHoney" type="checkbox" class="custom-checkbox" />
        </label>



        <p class="setting-hint mine-target-intro">
          <strong>Quặng cần đào:</strong>
        </p>
        <div class="mine-target-bunch">
          <label class="mine-chip">
            <input id="mineTargetStone" type="checkbox" checked />
            <span>Đá (stone)</span>
          </label>
          <label class="mine-chip">
            <input id="mineTargetIron" type="checkbox" checked />
            <span>Sắt (iron)</span>
          </label>
          <label class="mine-chip">
            <input id="mineTargetGold" type="checkbox" checked />
            <span>Vàng (gold rock)</span>
          </label>
          <label class="mine-chip">
            <input id="mineTargetCrimstone" type="checkbox" checked />
            <span>Crimstone</span>
          </label>
          <label class="mine-chip">
            <input id="mineTargetSunstone" type="checkbox" />
            <span>Sunstone</span>
          </label>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
