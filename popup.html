<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunflower Land UI Automation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup-shell">
      <section class="hero-card">
        <div class="hero-copy">
          <p class="eyebrow">Sunflower Land</p>
          <h1>UI Automation</h1>
          <p class="hero-text">v2.0.0 — UI-first automation helper</p>
        </div>
        <label class="power-switch" aria-label="Bật hoặc tắt toàn bộ">
          <input id="masterEnabled" type="checkbox" checked />
          <span class="power-track">
            <span class="power-label power-off">OFF</span>
            <span class="power-thumb"></span>
            <span class="power-label power-on">ON</span>
          </span>
        </label>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="panel-kicker">Tác vụ chính</p>
            <h2>Cấu hình tự động</h2>
          </div>
        </div>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Auto mua công cụ + hạt giống</strong>
          </span>
          <span class="toggle">
            <input id="autoBuyTools" type="checkbox" />
            <span class="toggle-ui"></span>
          </span>
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Restock Blacksmith khi hết stock</strong>
          </span>
          <span class="toggle">
            <input id="autoRestockBlacksmith" type="checkbox" />
            <span class="toggle-ui"></span>
          </span>
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Sunflower cơ bản</strong>
          </span>
          <span class="toggle">
            <input id="autoSunflowerBasic" type="checkbox" checked />
            <span class="toggle-ui"></span>
          </span>
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Tự nấu Fire Pit (bridge)</strong>
          </span>
          <span class="toggle">
            <input id="autoCookFirePit" type="checkbox" />
            <span class="toggle-ui"></span>
          </span>
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Tự nấu Kitchen (bridge)</strong>
          </span>
          <span class="toggle">
            <input id="autoCookKitchen" type="checkbox" />
            <span class="toggle-ui"></span>
          </span>
        </label>

        <div class="input-grid" style="margin: -8px 0 12px">
          <label class="input-field">
            <span>Ưu tiên món nấu</span>
            <input
              id="cookPreferredRecipe"
              type="text"
              maxlength="80"
              spellcheck="false"
              placeholder="vd: Pancakes"
            />
          </label>
        </div>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Trồng + thu hoạch cây ăn quả (DOM)</strong>
          </span>
          <span class="toggle">
            <input id="autoFruitTree" type="checkbox" />
            <span class="toggle-ui"></span>
          </span>
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Thu hoạch hoa, mật ong (DOM + Bridge)</strong>
          </span>
          <span class="toggle">
            <input id="autoHoney" type="checkbox" />
            <span class="toggle-ui"></span>
          </span>
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Kẹt captcha Goblin / Moon → hard reload</strong>
          </span>
          <span class="toggle">
            <input id="reloadPageOnGoblinMoonCaptcha" type="checkbox" checked />
            <span class="toggle-ui"></span>
          </span>
        </label>
        <p class="setting-hint" style="margin: -4px 0 10px">
          Đã thoát bằng tải lại: <strong id="captchaReloadSkipCount">0</strong> lần
          <button type="button" id="resetCaptchaReloadSkipCount" class="ghost-button" style="margin-left: 8px; padding: 4px 10px; width: auto; display: inline-block;">
            Xóa số đếm
          </button>
        </p>
        <p class="setting-hint" style="margin: -4px 0 10px">
          Captcha: <span style="color:#16a34a">✓ Thành công: <strong id="captchaSolvedCount">0</strong></span>
          &nbsp;|&nbsp;
          <span style="color:#dc2626">✗ Thất bại: <strong id="captchaFailedCount">0</strong></span>
        </p>

        <div class="input-grid" style="margin: -8px 0 12px">
          <label class="input-field">
            <span>Tên hạt ruộng</span>
            <input id="cropDomSeedName" type="text" maxlength="80" spellcheck="false" placeholder="Trống = Auto (theo mùa)" />
          </label>
        </div>
        <label class="setting-row">
          <span class="setting-copy">
            <strong>Ưu tiên hạt lớn nhanh (catalogue)</strong>
          </span>
          <span class="toggle">
            <input id="cropDomSkipLongGrow" type="checkbox" checked />
            <span class="toggle-ui"></span>
          </span>
        </label>
        <label class="setting-row">
          <span class="setting-copy">
            <strong>Mua hạt tại Betty (Market)</strong>
          </span>
          <span class="toggle">
            <input id="cropDomBuySeedsAtBetty" type="checkbox" checked />
            <span class="toggle-ui"></span>
          </span>
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Tự thu nấm (wild / magic)</strong>
          </span>
          <span class="toggle">
            <input id="autoHarvestMushrooms" type="checkbox" checked />
            <span class="toggle-ui"></span>
          </span>
        </label>

        <p class="setting-hint mine-target-intro">
          <strong>Loại nấm cần thu:</strong>
        </p>
        <div class="mine-target-bunch">
          <label class="mine-chip">
            <input id="mushroomTargetWild" type="checkbox" checked />
            <span>Wild mushroom</span>
          </label>
          <label class="mine-chip">
            <input id="mushroomTargetMagic" type="checkbox" checked />
            <span>Magic mushroom</span>
          </label>
        </div>

        <p class="setting-hint mine-target-intro">
          <strong>Quặng cần đào:</strong>
        </p>
        <div class="mine-target-bunch">
          <label class="mine-chip">
            <input id="mineTargetStone" type="checkbox" checked />
            <span>Đá (stone)</span>
          </label>
          <label class="mine-chip">
            <input id="mineTargetIron" type="checkbox" checked />
            <span>Sắt (iron)</span>
          </label>
          <label class="mine-chip">
            <input id="mineTargetGold" type="checkbox" checked />
            <span>Vàng (gold rock)</span>
          </label>
          <label class="mine-chip">
            <input id="mineTargetCrimstone" type="checkbox" checked />
            <span>Crimstone</span>
          </label>
          <label class="mine-chip">
            <input id="mineTargetSunstone" type="checkbox" />
            <span>Sunstone</span>
          </label>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
